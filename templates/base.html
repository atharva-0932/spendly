<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Spendly{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
    <script>(function(){var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>

    <nav class="navbar">
        <div class="nav-inner">
            <a href="{{ url_for('landing') }}" class="nav-brand">
                <span class="brand-icon">◈</span>
                <span class="brand-name">Spendly</span>
            </a>
            <div class="nav-links">
                <a href="{{ url_for('login') }}">Sign in</a>
                <div class="theme-picker" id="themePicker">
                    <button class="theme-toggle" id="themeToggle" aria-label="Change theme" title="Change theme">◑</button>
                    <div class="theme-dropdown" id="themeDropdown">
                        <button class="theme-opt" data-theme="light"><span class="theme-dot" style="background:#1a472a"></span>Light</button>
                        <button class="theme-opt" data-theme="dark"><span class="theme-dot" style="background:#4fa368;border-color:rgba(255,255,255,0.15)"></span>Dark</button>
                        <button class="theme-opt" data-theme="ocean"><span class="theme-dot" style="background:#1a5cad"></span>Ocean</button>
                        <button class="theme-opt" data-theme="sunset"><span class="theme-dot" style="background:#bf4a15"></span>Sunset</button>
                        <button class="theme-opt" data-theme="violet"><span class="theme-dot" style="background:#6b2fa0"></span>Violet</button>
                    </div>
                </div>
                <a href="{{ url_for('register') }}" class="nav-cta">Get started</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <span class="brand-icon">◈</span>
            <span class="footer-name">Spendly</span>
            <p class="footer-copy">Track every rupee. Own your finances.</p>
            <div class="footer-links">
                <a href="/terms">Terms and Conditions</a>
                <a href="/privacy">Privacy Policy</a>
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
